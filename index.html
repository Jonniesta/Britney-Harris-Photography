<form
  action="https://formsubmit.co/YOUR_EMAIL@gmail.com"
  method="POST"
>

  <!-- Disable captcha -->
  <input
    type="hidden"
    name="_captcha"
    value="false"
  >

  <!-- Redirect after submit -->
  <input
    type="hidden"
    name="_next"
    value="https://YOURUSERNAME.github.io/thankyou.html"
  >

  <!-- NAME -->
  <input
    type="text"
    name="name"
    placeholder="Your Name"
    required
  >

  <!-- EMAIL -->
  <input
    type="email"
    name="email"
    placeholder="Your Email"
    required
  >

  <!-- PHONE -->
  <input
    type="tel"
    name="phone"
    placeholder="Phone Number"
  >

  <!-- BEST CONTACT METHOD -->
  <select
    name="best_contact_method"
    required
  >

    <option value="">
      Preferred Contact Method
    </option>

    <option>Email</option>
    <option>Phone Call</option>
    <option>Text Message</option>

  </select>

  <!-- SESSION TYPE -->
  <select
    name="session"
    required
  >

    <option value="">
      Select Session Type
    </option>

    <option>Wedding</option>
    <option>Portrait</option>
    <option>Family</option>
    <option>Animal</option>
    <option>Nature</option>
    <option>Business Branding</option>

  </select>

  <!-- MESSAGE -->
  <textarea
    name="message"
    placeholder="Tell me about your vision..."
    required
  ></textarea>

  <button type="submit">
    Send Inquiry
  </button>

</form>
